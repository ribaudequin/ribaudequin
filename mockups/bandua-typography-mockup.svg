<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        src: url('fonts/space-grotesk-400.woff2') format('truetype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Space Grotesk';
        src: url('fonts/space-grotesk-500.woff2') format('truetype');
        font-weight: 500;
      }
      @font-face {
        font-family: 'Fraunces';
        src: url('fonts/fraunces-400.woff2') format('truetype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Fraunces';
        src: url('fonts/fraunces-500.woff2') format('truetype');
        font-weight: 500;
      }
      @font-face {
        font-family: 'Fraunces';
        src: url('fonts/fraunces-600.woff2') format('truetype');
        font-weight: 600;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/usr/share/fonts/truetype/jetbrains-mono-zorin-os/JetBrainsMono-Regular.ttf') format('truetype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/usr/share/fonts/truetype/jetbrains-mono-zorin-os/JetBrainsMono-Medium.ttf') format('truetype');
        font-weight: 500;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#0F2A2E"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Space Grotesk" font-size="14" font-weight="500" letter-spacing="3" fill="#F2F5EE" opacity="0.5">BANDUA STUDIO — TYPOGRAPHY OPTIONS</text>
  
  <!-- Card A: Space Grotesk -->
  <rect x="50" y="80" width="340" height="380" rx="16" fill="#F2F5EE"/>
  <text x="70" y="110" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="2" fill="#0F2A2E" opacity="0.4">A · SPACE GROTESK</text>
  <text x="220" y="180" text-anchor="middle" font-family="Space Grotesk" font-size="56" font-weight="500" fill="#0F2A2E">bandua</text>
  <text x="220" y="240" text-anchor="middle" font-family="Space Grotesk" font-size="13" font-weight="500" letter-spacing="6" fill="#0F2A2E" opacity="0.6">STUDIO</text>
  <text x="220" y="270" text-anchor="middle" font-family="Space Grotesk" font-size="12" font-weight="400" fill="#0F2A2E" opacity="0.4">by Marcelo Salvador</text>
  <text x="220" y="310" text-anchor="middle" font-family="Space Grotesk" font-size="13" font-weight="400" fill="#0F2A2E" opacity="0.5">Things built to last.</text>
  <line x1="90" y1="340" x2="350" y2="340" stroke="#0F2A2E" stroke-width="1" opacity="0.1"/>
  <text x="220" y="370" text-anchor="middle" font-family="Space Grotesk" font-size="10" font-weight="600" letter-spacing="2" fill="#0F2A2E" opacity="0.3">JETBRAINS MONO</text>
  <text x="220" y="400" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="400" fill="#0F2A2E" opacity="0.6">const bandua = await build();</text>
  
  <!-- Card B: Fraunces -->
  <rect x="430" y="80" width="340" height="380" rx="16" fill="#F2F5EE"/>
  <text x="450" y="110" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="2" fill="#0F2A2E" opacity="0.4">B · FRAUNCES</text>
  <text x="600" y="180" text-anchor="middle" font-family="Fraunces" font-size="56" font-weight="500" fill="#0F2A2E">bandua</text>
  <text x="600" y="240" text-anchor="middle" font-family="Fraunces" font-size="13" font-weight="500" letter-spacing="6" fill="#0F2A2E" opacity="0.6">STUDIO</text>
  <text x="600" y="270" text-anchor="middle" font-family="Fraunces" font-size="12" font-weight="400" fill="#0F2A2E" opacity="0.4">by Marcelo Salvador</text>
  <text x="600" y="310" text-anchor="middle" font-family="Fraunces" font-size="13" font-weight="400" fill="#0F2A2E" opacity="0.5">Things built to last.</text>
  <line x1="470" y1="340" x2="730" y2="340" stroke="#0F2A2E" stroke-width="1" opacity="0.1"/>
  <text x="600" y="370" text-anchor="middle" font-family="Space Grotesk" font-size="10" font-weight="600" letter-spacing="2" fill="#0F2A2E" opacity="0.3">JETBRAINS MONO</text>
  <text x="600" y="400" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="400" fill="#0F2A2E" opacity="0.6">const bandua = await build();</text>
  
  <!-- Card C: JetBrains Mono -->
  <rect x="810" y="80" width="340" height="380" rx="16" fill="#F2F5EE"/>
  <text x="830" y="110" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="2" fill="#0F2A2E" opacity="0.4">C · JETBRAINS MONO</text>
  <text x="980" y="180" text-anchor="middle" font-family="JetBrains Mono" font-size="56" font-weight="500" fill="#0F2A2E">bandua</text>
  <text x="980" y="240" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="500" letter-spacing="6" fill="#0F2A2E" opacity="0.6">STUDIO</text>
  <text x="980" y="270" text-anchor="middle" font-family="JetBrains Mono" font-size="12" font-weight="400" fill="#0F2A2E" opacity="0.4">by Marcelo Salvador</text>
  <text x="980" y="310" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="400" fill="#0F2A2E" opacity="0.5">Things built to last.</text>
  <line x1="850" y1="340" x2="1110" y2="340" stroke="#0F2A2E" stroke-width="1" opacity="0.1"/>
  <text x="980" y="370" text-anchor="middle" font-family="Space Grotesk" font-size="10" font-weight="600" letter-spacing="2" fill="#0F2A2E" opacity="0.3">JETBRAINS MONO</text>
  <text x="980" y="400" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="400" fill="#0F2A2E" opacity="0.6">const bandua = await build();</text>
  
  <!-- Recommendation -->
  <rect x="50" y="500" width="1100" height="80" rx="12" fill="#1F5F66"/>
  <text x="600" y="530" text-anchor="middle" font-family="Space Grotesk" font-size="14" font-weight="400" fill="#F2F5EE" opacity="0.8">Recomendação: Space Grotesk — equilíbrio entre carácter e versatilidade.</text>
  <text x="600" y="555" text-anchor="middle" font-family="Space Grotesk" font-size="14" font-weight="400" fill="#F2F5EE" opacity="0.8">JetBrains Mono para código e documentação.</text>
</svg>