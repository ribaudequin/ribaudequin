<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        src: url('fonts/space-grotesk-400.woff2') format('truetype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Space Grotesk';
        src: url('fonts/space-grotesk-500.woff2') format('truetype');
        font-weight: 500;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#0F2A2E"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Space Grotesk" font-size="14" font-weight="500" letter-spacing="3" fill="#F2F5EE" opacity="0.5">BANDUA STUDIO — SYMBOL OPTIONS</text>
  
  <!-- Card A: Current Arc (Shelter) -->
  <rect x="50" y="80" width="340" height="380" rx="16" fill="#F2F5EE"/>
  <text x="70" y="110" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="2" fill="#0F2A2E" opacity="0.4">A · CURRENT ARC</text>
  <g transform="translate(220, 200)" stroke="#0F2A2E" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M-60 60 V30 A60 60 0 0 1 60 30 V60"/>
    <path d="M-30 60 V35 A30 30 0 0 1 30 35 V60"/>
  </g>
  <text x="220" y="310" text-anchor="middle" font-family="Space Grotesk" font-size="13" font-weight="500" fill="#0F2A2E" opacity="0.6">Two concentric arcs</text>
  <text x="220" y="340" text-anchor="middle" font-family="Space Grotesk" font-size="12" font-weight="400" fill="#0F2A2E" opacity="0.4">Shelter / protection</text>
  
  <!-- Card B: Shield + Code -->
  <rect x="430" y="80" width="340" height="380" rx="16" fill="#F2F5EE"/>
  <text x="450" y="110" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="2" fill="#0F2A2E" opacity="0.4">B · SHIELD + CODE</text>
  <g transform="translate(600, 200)" stroke="#0F2A2E" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M0 -50 L40 -30 V10 C40 40 20 55 0 60 C-20 55 -40 40 -40 10 V-30 Z"/>
    <path d="M-15 0 L-5 10 L15 -10"/>
  </g>
  <text x="600" y="310" text-anchor="middle" font-family="Space Grotesk" font-size="13" font-weight="500" fill="#0F2A2E" opacity="0.6">Shield with checkmark</text>
  <text x="600" y="340" text-anchor="middle" font-family="Space Grotesk" font-size="12" font-weight="400" fill="#0F2A2E" opacity="0.4">Security / validation</text>
  
  <!-- Card C: Hexagon + B -->
  <rect x="810" y="80" width="340" height="380" rx="16" fill="#F2F5EE"/>
  <text x="830" y="110" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="2" fill="#0F2A2E" opacity="0.4">C · HEXAGON + B</text>
  <g transform="translate(980, 200)" stroke="#0F2A2E" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M0 -50 L43 -25 V25 L0 50 L-43 25 V-25 Z"/>
    <text x="0" y="15" text-anchor="middle" font-family="Space Grotesk" font-size="40" font-weight="500" fill="#0F2A2E" stroke="none">B</text>
  </g>
  <text x="980" y="310" text-anchor="middle" font-family="Space Grotesk" font-size="13" font-weight="500" fill="#0F2A2E" opacity="0.6">Hexagon with monogram</text>
  <text x="980" y="340" text-anchor="middle" font-family="Space Grotesk" font-size="12" font-weight="400" fill="#0F2A2E" opacity="0.4">Structure / building blocks</text>
  
  <!-- Card D: Compass -->
  <rect x="50" y="500" width="340" height="380" rx="16" fill="#F2F5EE"/>
  <text x="70" y="530" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="2" fill="#0F2A2E" opacity="0.4">D · COMPASS</text>
  <g transform="translate(220, 620)" stroke="#0F2A2E" stroke-width="6" stroke-linecap="round" fill="none">
    <circle cx="0" cy="0" r="50"/>
    <path d="M0 -35 L10 0 L0 35 L-10 0 Z" fill="#0F2A2E"/>
  </g>
  <text x="220" y="730" text-anchor="middle" font-family="Space Grotesk" font-size="13" font-weight="500" fill="#0F2A2E" opacity="0.6">Compass / direction</text>
  <text x="220" y="760" text-anchor="middle" font-family="Space Grotesk" font-size="12" font-weight="400" fill="#0F2A2E" opacity="0.4">Guidance / exploration</text>
  
  <!-- Card E: Anvil -->
  <rect x="430" y="500" width="340" height="380" rx="16" fill="#F2F5EE"/>
  <text x="450" y="530" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="2" fill="#0F2A2E" opacity="0.4">E · ANVIL</text>
  <g transform="translate(600, 620)" stroke="#0F2A2E" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M-40 -20 L40 -20 L30 0 L-30 0 Z"/>
    <path d="M-20 0 L-15 30 L15 30 L20 0"/>
    <path d="M-35 30 L35 30"/>
  </g>
  <text x="600" y="730" text-anchor="middle" font-family="Space Grotesk" font-size="13" font-weight="500" fill="#0F2A2E" opacity="0.6">Anvil / craftsmanship</text>
  <text x="600" y="760" text-anchor="middle" font-family="Space Grotesk" font-size="12" font-weight="400" fill="#0F2A2E" opacity="0.4">Building / forging tools</text>
  
  <!-- Card F: Key -->
  <rect x="810" y="500" width="340" height="380" rx="16" fill="#F2F5EE"/>
  <text x="830" y="530" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="2" fill="#0F2A2E" opacity="0.4">F · KEY</text>
  <g transform="translate(980, 620)" stroke="#0F2A2E" stroke-width="6" stroke-linecap="round" fill="none">
    <circle cx="-20" cy="0" r="15"/>
    <path d="M-5 0 L40 0"/>
    <path d="M30 0 L30 15"/>
    <path d="M40 0 L40 20"/>
  </g>
  <text x="980" y="730" text-anchor="middle" font-family="Space Grotesk" font-size="13" font-weight="500" fill="#0F2A2E" opacity="0.6">Key / access</text>
  <text x="980" y="760" text-anchor="middle" font-family="Space Grotesk" font-size="12" font-weight="400" fill="#0F2A2E" opacity="0.4">Security / encryption</text>
</svg>